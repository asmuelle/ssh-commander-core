# Dependabot version updates. Security updates are enabled separately in
# the repository settings; this file keeps routine bumps flowing so
# advisories land on an already-current tree.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The ref is the Rust toolchain version (the MSRV pin), not the
      # action's release; bumping it breaks the msrv job.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]
